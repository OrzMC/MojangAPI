name: Tests

on:
  # 只在 main 上跑 push；PR 分支的 push 交给 pull_request 事件，
  # 避免同一提交被 push+pull_request 各跑一次（曾因此每次 PR 双跑）。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # 缓存只在 main 落盘（PR 只 restore），避免分支各存一份互相驱逐。
      - name: Restore SwiftPM cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Build
        run: swift build -c debug
      - name: Run tests
        run: swift test -q
      - name: Save SwiftPM cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.cache.outputs.cache-primary-key }}
