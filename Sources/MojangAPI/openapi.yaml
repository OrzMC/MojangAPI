openapi: 3.1.0
info:
  title: Mojang API - OpenAPI 3.1
  description: |-
    This is Mojang API written in Swift for making a launcher yourself

    - **[MojangAPI Repo](https://github.com/OrzMC/MojangAPI)**

  version: 1.0.0
tags:
  - name: launcher
  - name: authserver
servers:
  - url: https://launchermeta.mojang.com
  - url: https://piston-meta.mojang.com
  - url: https://libraries.minecraft.net
  - url: https://resources.download.minecraft.net
  - url: https://api.mojang.com
paths:
  /mc/game/version_manifest.json:
    servers:
      - url: https://launchermeta.mojang.com
    get:
      tags:
        - launcher
      summary: get minecraft launcher meta information
      operationId: getMinecraftGameVersionManifest
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
  /v1/packages/{sha1}/{id}.json:
    servers:
      - url: https://piston-meta.mojang.com
    get:
      tags:
        - launcher
      summary: get specified package meta with sha1 and id
      operationId: getPackage
      parameters:
        - name: sha1
          in: path
          description: sha1 of package
          required: true
          allowEmptyValue: false
          schema:
            type: string
            default: a3bcba436caa849622fd7e1e5b89489ed6c9ac63
        - name: id
          in: path
          description: package id
          required: true
          allowEmptyValue: false
          schema:
            type: string
            default: 1.21.4
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
  /users/profiles/minecraft/{username}:
    servers:
        - url: https://api.mojang.com
    get:
      tags:
        - api
      summary: get user info
      operationId: getUserInfoWithName
      parameters:
        - name: username
          in: path
          description: username of player
          required: true
          allowEmptyValue: false
          schema:
            type: string
            default: Notch
      responses:
        '200':
          description: Success
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserInfo'

  # Microsoft-related paths removed to keep MojangAPI pure
components:
  schemas:
    Manifest:
      type: object
      required:
        - latest
        - versions
      properties:
        latest:
          $ref: '#/components/schemas/Latest'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
    Latest:
      type: object
      required:
        - release
        - snapshot
      properties:
        release:
          type: string
          examples:
            - 1.21.4
        snapshot:
          type: string
          examples:
            - 1.21.4
    Version:
      type: object
      required:
        - id
        - type
        - url
      properties:
        id:
          type: string
          examples:
            - 1.21.4
            - 1.21.4-rc3
        type:
          type: string
          enum:
            - release
            - snapshot
            - old_alpha
            - old_beta
        url:
          type: string
          examples:
            - >-
              https://piston-meta.mojang.com/v1/packages/a3bcba436caa849622fd7e1e5b89489ed6c9ac63/1.21.4.json
            - >-
              https://piston-meta.mojang.com/v1/packages/b36938455cb91bc58c7463de80909764036576a2/1.21.4-rc1.json
        time:
          type: string
          examples:
            - '2024-12-03T10:24:48+00:00'
        releaseTime:
          type: string
          examples:
            - '2024-12-03T10:12:57+00:00'
    Package:
      type: object
      oneOf:
        - $ref: '#/components/schemas/GameVersion'
        - $ref: '#/components/schemas/GameVersionAsset'
    GameVersion:
      type: object
      required:
        - arguments
        - assetIndex
        - libraries
        - downloads
        - mainClass
        - id
        - type
        - time
        - releaseTime
        - minimumLauncherVersion
        - logging
      properties:
        arguments:
          $ref: '#/components/schemas/Arguments'
        assetIndex:
          $ref: '#/components/schemas/AssetIndex'
        assets:
          type: string
        complianceLevel:
          type: number
          format: int64
        downloads:
          $ref: '#/components/schemas/Downloads'
        id:
          type: string
        javaVersion:
          type: object
          required:
            - majorVersion
          properties:
            component:
              type: string
            majorVersion:
              type: number
              format: int64
        libraries:
          type: array
          items:
            $ref: '#/components/schemas/Library'
        logging:
          type: object
          required:
            - client
          properties:
            client:
              type: object
              required:
                - file
                - type
                - argument
              properties:
                argument:
                  type: string
                file:
                  $ref: '#/components/schemas/AssetWithId'
                type:
                  type: string
        mainClass:
          type: string
        minimumLauncherVersion:
          type: number
          format: int64
        releaseTime:
          type: string
        time:
          type: string
        type:
          type: string
    Arguments:
      type: object
      required:
        - game
        - jvm
      properties:
        game:
          type: array
          items:
            $ref: '#/components/schemas/Argument'
        jvm:
          type: array
          items:
            $ref: '#/components/schemas/Argument'
    Downloads:
      type: object
      required:
        - client
        - server
      properties:
        client:
          $ref: '#/components/schemas/Asset'
        client_mappings:
          $ref: '#/components/schemas/Asset'
        server:
          $ref: '#/components/schemas/Asset'
        server_mappings:
          $ref: '#/components/schemas/Asset'
    AssetIndex:
      type: object
      required:
        - id
        - totalSize
        - sha1
        - size
        - url
      properties:
        id:
          type: string
        totalSize:
          type: number
          format: int64
        sha1:
          type: string
        size:
          type: number
          format: int64
        url:
          type: string
    Asset:
      type: object
      required:
        - sha1
        - size
        - url
      properties:
        sha1:
          type: string
        size:
          type: number
          format: int64
        url:
          type: string
    AssetWithId:
      type: object
      required:
        - id
        - sha1
        - size
        - url
      properties:
        id:
          type: string
        sha1:
          type: string
        size:
          type: number
          format: int64
        url:
          type: string
    AssetWithPath:
      type: object
      required:
        - path
        - sha1
        - size
        - url
      properties:
        path:
          type: string
        sha1:
          type: string
        size:
          type: number
          format: int64
        url:
          type: string
    Library:
      type: object
      required:
        - name
        - downloads
      properties:
        downloads:
          type: object
          required:
            - artifact
          properties:
            artifact:
              $ref: '#/components/schemas/AssetWithPath'
        name:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
    Rule:
      type: object
      required:
        - action
      properties:
        action:
          type: string
        os:
          type: object
          properties:
            name:
              type: string
        features:
          $ref: '#/components/schemas/Features'
    Argument:
      oneOf:
        - type: string
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/Rule'
            value:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
    Features:
      type: object
      additionalProperties:
        type: boolean
      examples:
        - is_demo_user: true
        - has_custom_resolution: false
    GameVersionAsset:
      type: object
      required:
        - objects
      properties:
        objects:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Object'
    Object:
      type: object
      required:
        - hash
        - size
      properties:
        hash:
          type: string
        size:
          type: number
          format: int64
    UserInfo:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          examples:
            - Notch
        name:
          type: string
          examples:
            - 069a79f444e94726a5befca90e38aaf5
    # Microsoft-related schemas removed
